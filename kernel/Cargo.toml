[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = { version = "2.11", default-features = false }
elf = { version = "0.8", default-features = false, features = ["alloc"] }
limine = { git = "https://github.com/SkillerRaptor/limine-rs.git" }
log = { version = "0.4", default-features = false }

flanterm-sys = { path = "../bindings/flanterm" }
uacpi-sys = { path = "../bindings/uacpi" }

[build-dependencies]
nasm-rs = { version = "0.3", features = ["parallel"] }
