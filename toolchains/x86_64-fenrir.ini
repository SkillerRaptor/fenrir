[host_machine]
system = 'fenrir'
cpu = 'x86_64'
cpu_family = 'x86_64'
endian = 'little'

[binaries]
c = 'x86_64-fenrir-gcc'
cpp = 'x86_64-fenrir-g++'
ld = 'x86_64-fenrir-ld'
ar = 'x86_64-fenrir-ar'
strip = 'x86_64-fenrir-strip'
nasm = 'nasm'

[built-in options]
c_args = ['-march=x86-64', '-mabi=sysv']
cpp_args = ['-march=x86-64', '-mabi=sysv']
