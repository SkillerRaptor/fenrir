[host_machine]
system = 'fenrir'
cpu = 'x86_64'
cpu_family = 'x86_64'
endian = 'little'

[binaries]
c = 'clang'
cpp = 'clang++'
ld = 'ld.lld'
ar = 'llvm-ar'
strip = 'llvm-strip'
nasm = 'nasm'

[built-in options]
c_args = ['--target=x86_64-unknown-none-elf']
cpp_args = ['--target=x86_64-unknown-none-elf']
c_link_args = ['-fuse-ld=lld', '--target=x86_64-unknown-none-elf']
cpp_link_args = ['-fuse-ld=lld', '--target=x86_64-unknown-none-elf']

[properties]
needs_exe_wrapper = true
